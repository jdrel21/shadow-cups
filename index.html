<!DOCTYPE html><html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Cups</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
 margin:0;
 font-family:'Segoe UI',sans-serif;
 background:radial-gradient(circle at top,#021018,#000);
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow-x:hidden;
}

.panel{
 width:560px;
 max-width:94vw;
 background:linear-gradient(160deg,#0b2a3d,#04141c);
 border-radius:26px;
 padding:26px;
 box-shadow:0 60px 180px rgba(0,0,0,.95);
 position:relative;
}

.hidden{display:none}

input,select{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 margin:14px 0;
}

button{
 width:100%;
 padding:16px;
 border:none;
 border-radius:16px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(90deg,#00e676,#00c853);
 transition:.2s;
 margin-top:14px;
}

button:active{transform:scale(.96)}
.secondary{background:#ff5252}

.auth-buttons button{
 margin-top:18px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 margin-bottom:18px;
}

.table{
 position:relative;
 height:240px;
 margin:30px 0;
 border-radius:20px;
 background:radial-gradient(circle,#063a52,#010b12);
 overflow:hidden;
}

.cup{
 width:85px;
 height:110px;
 position:absolute;
 bottom:55px;
 border-radius:80px 80px 0 0;
 background:linear-gradient(#ffc46b,#ff6d00);
 box-shadow:0 12px 30px rgba(0,0,0,.7);
 transition:left .35s ease, transform .25s ease;
}

.glow{
 box-shadow:0 0 25px gold,0 0 50px orange;
}

.lift{transform:translateY(-70px)}

.ball{
 width:26px;
 height:26px;
 border-radius:50%;
 background:radial-gradient(circle,#fff,#ff1744);
 position:absolute;
 bottom:35px;
 transition:left .35s ease, opacity .2s;
}

.bet-row{
 display:flex;
 gap:18px;
 margin-top:20px;
}

.bet-row button{
 flex:1;
}

.stats{
 display:flex;
 justify-content:space-between;
 margin-top:18px;
}

.msg{
 text-align:center;
 font-weight:bold;
 margin-top:16px;
}

/* SIDE THUMBNAILS */
.side-preview{
 position:absolute;
 top:50%;
 transform:translateY(-50%);
 width:120px;
 opacity:.25;
}

.left-preview{ left:-140px; }
.right-preview{ right:-140px; }

.preview-cup{
 width:50px;
 height:70px;
 background:linear-gradient(#ffc46b,#ff6d00);
 border-radius:40px 40px 0 0;
 margin:10px auto;
 animation:previewShuffle 2s infinite ease-in-out alternate;
}

@keyframes previewShuffle{
 from{ transform:translateX(-10px); }
 to{ transform:translateX(10px); }
}

.donate{
 margin-top:20px;
 background:linear-gradient(90deg,#6200ea,#aa00ff);
}

</style></head><body><div id="auth" class="panel">
<h1>🎰 Shadow Cups</h1>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Parolă (min 6)">
<div class="auth-buttons">
<button onclick="register()">Înregistrare</button>
<button onclick="login()">Login</button>
</div>
</div><div id="game" class="panel hidden"><div class="side-preview left-preview">
<div class="preview-cup"></div>
<div class="preview-cup"></div>
<div class="preview-cup"></div>
</div><div class="side-preview right-preview">
<div class="preview-cup"></div>
<div class="preview-cup"></div>
<div class="preview-cup"></div>
</div><div class="topbar">
<div>💰 Coins: <span id="coins">0</span></div>
<select id="level">
<option value="easy">Easy x3</option>
<option value="medium">Medium x5</option>
<option value="hard">Hard x10</option>
<option value="extreme">Extreme x15</option>
<option value="insane">Insane x20</option>
</select>
</div><h2>Găsește bila</h2><div class="table" id="table">
<div id="ball" class="ball"></div>
</div><div class="bet-row">
<button onclick="setBet(1000)">1000</button>
<button onclick="setBet(5000)">5000</button>
<button onclick="setBet(10000)">10000</button>
<button onclick="allIn()">ALL IN</button>
</div><button onclick="startRound()">START</button> <button class="secondary" onclick="logout()">Logout</button>

<button class="donate" onclick="window.open('https://revolut.me/jdrel21','_blank')">💜 Susține proiectul</button>

<div class="stats">
<div>Victorii: <span id="wins">0</span></div>
<div>Înfrângeri: <span id="loss">0</span></div>
</div><div class="msg" id="msg"></div></div><audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio> <audio id="shuffleSound" src="https://assets.mixkit.co/sfx/preview/mixkit-card-shuffle-2036.mp3"></audio>

<script>

const SUPABASE_URL="https://pakagqkhpwzcqrluyarw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBha2FncWtocHd6Y3FybHV5YXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5OTg2NTgsImV4cCI6MjA4NjU3NDY1OH0.l24o0QSKN7Dnn9O3ptimbCNqAs6yzO3KnDIb2JxsYwA";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let userData=null;
let coins=0,wins=0,loss=0;
let cups=[],slots=[],ballCup=null,playing=false,bet=5000;

async function register(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value.trim();
 if(pass.length<6) return alert("Parolă minim 6 caractere");
 const {error}=await sb.auth.signUp({email,password:pass});
 if(error) return alert(error.message);
 alert("Cont creat.");
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value.trim();
 const {error}=await sb.auth.signInWithPassword({email,password:pass});
 if(error) return alert(error.message);
 initGame();
}

async function logout(){
 await sb.auth.signOut();
 location.reload();
}

sb.auth.onAuthStateChange((event,session)=>{
 if(session?.user){ initGame(); }
});

async function checkSession(){
 const {data:{session}}=await sb.auth.getSession();
 if(session?.user){ initGame(); }
}
checkSession();

async function initGame(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user) return;
 userData=user;
 document.getElementById('auth').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');

 let {data}=await sb.from('players').select('*').eq('id',user.id).maybeSingle();

 if(!data){
  await sb.from('players').insert({ id:user.id,email:user.email,coins:100000,wins:0,loss:0 });
  return initGame();
 }

 coins=data.coins;
 wins=data.wins;
 loss=data.loss;
 updateHUD();
 createCups();
}

function updateHUD(){
 document.getElementById('coins').innerText=coins;
 document.getElementById('wins').innerText=wins;
 document.getElementById('loss').innerText=loss;
}

function msg(t){ document.getElementById('msg').innerText=t; }

function setBet(v){bet=v;msg("Pariu: "+v);} 
function allIn(){bet=coins;msg("ALL IN");}

function createCups(){
 const table=document.getElementById('table');
 table.querySelectorAll('.cup').forEach(c=>c.remove());
 cups=[]; slots=[];
 const spacing=table.offsetWidth/3.5;
 for(let i=0;i<3;i++){
  const pos=spacing*(i+1)-42;
  slots.push(pos);
  const cup=document.createElement('div');
  cup.className='cup';
  cup.style.left=pos+'px';
  table.appendChild(cup);
  cups.push(cup);
 }
}

function attachBall(cup){ ballCup=cup; moveBall(); document.getElementById('ball').style.opacity=1; }
function moveBall(){ const index=cups.indexOf(ballCup); document.getElementById('ball').style.left=(slots[index]+30)+'px'; }
function hideBall(){ document.getElementById('ball').style.opacity=0; }
function resetCups(){ cups.forEach(c=>c.classList.remove('lift','glow')); }

function shuffleArray(){
 for(let i=0;i<3;i++){
  const a=Math.floor(Math.random()*3);
  const b=Math.floor(Math.random()*3);
  [cups[a],cups[b]]=[cups[b],cups[a]];
 }
 cups.forEach((cup,index)=>{ cup.style.left=slots[index]+'px'; });
 moveBall();
}

function startRound(){
 if(playing) return;
 if(coins<bet) return msg("Nu ai coins");

 resetCups();
 attachBall(cups[Math.floor(Math.random()*3)]);
 coins-=bet;
 updateHUD();
 msg("Urmărește bila...");

 const lvl=document.getElementById('level').value;
 let speed=260,times=12,multi=3;

 if(lvl==='easy'){speed=380;times=10;multi=3;}
 if(lvl==='medium'){speed=260;times=14;multi=5;}
 if(lvl==='hard'){speed=210;times=18;multi=10;}
 if(lvl==='extreme'){speed=170;times=22;multi=15;}
 if(lvl==='insane'){speed=140;times=26;multi=20;}

 setTimeout(()=>{
  hideBall();
  document.getElementById('shuffleSound').play();
  let i=0;
  const loop=setInterval(()=>{
   shuffleArray();
   i++;
   if(i>=times){
    clearInterval(loop);
    playing=true;
    msg("Alege un pahar!");
    cups.forEach(c=>c.onclick=()=>pick(c,multi));
   }
  },speed);
 },900);
}

async function pick(cup,multi){
 if(!playing) return;
 playing=false;
 resetCups();
 cup.classList.add('lift');
 document.getElementById('ball').style.opacity=1;

 if(cup===ballCup){
  const win=bet*multi;
  coins+=win;
  wins++;
  document.getElementById('winSound').play();
  cup.classList.add('glow');
  msg("🔥 AI CÂȘTIGAT "+win);
 }else{
  loss++;
  ballCup.classList.add('lift');
  msg("❌ Ai pierdut");
 }

 updateHUD();
 await sb.from('players').update({coins,wins,loss}).eq('id',userData.id);
}

</script></body>
</html>
