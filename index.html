<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Cups - Premium Casino Game</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

:root {
  --gold: #D4AF37;
  --gold-light: #F3E5AB;
  --gold-dark: #a18216;
  --bg-dark: #09090b;
  --bg-card: #18181b;
  --felt-dark: #05180f;
  --felt-light: #0f331e;
  --red: #dc2626;
  --green: #16a34a;
  --text-primary: #fafafa;
  --text-secondary: #a1a1aa;
  --text-muted: #52525b;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== BACKGROUND PARTICLES ========== */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.3;
  animation: float 15s infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

/* ========== GLASS EFFECT ========== */
.glass {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* ========== AUTH PANEL ========== */
.auth-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.auth-panel {
  width: 100%;
  max-width: 420px;
  padding: 48px;
  border-radius: 32px;
  text-align: center;
}

.auth-logo {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease infinite;
  margin-bottom: 8px;
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.auth-subtitle {
  color: var(--text-secondary);
  margin-bottom: 40px;
  font-size: 1.1rem;
}

.input-group {
  margin-bottom: 20px;
  text-align: left;
}

.input-group label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.input-group input {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: var(--text-primary);
  font-size: 1rem;
  font-family: inherit;
  transition: all 0.3s ease;
}

.input-group input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
}

.input-group input::placeholder {
  color: var(--text-muted);
}

.btn {
  width: 100%;
  padding: 18px 32px;
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 12px;
}

.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: var(--bg-dark);
  box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4);
}

.btn-gold:active {
  transform: translateY(0);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
}

.auth-divider {
  display: flex;
  align-items: center;
  margin: 24px 0;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.auth-divider::before,
.auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
}

.auth-divider span {
  padding: 0 16px;
}

/* ========== GAME CONTAINER ========== */
.game-container {
  min-height: 100vh;
  padding: 20px;
  position: relative;
  z-index: 1;
}

.hidden { display: none !important; }

/* ========== NAVBAR ========== */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-radius: 20px;
  margin-bottom: 24px;
}

.nav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-logo svg {
  width: 32px;
  height: 32px;
}

.nav-stats {
  display: flex;
  gap: 24px;
  align-items: center;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
}

.stat-icon {
  font-size: 1.2rem;
}

.stat-value {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--gold);
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.btn-logout {
  padding: 10px 20px;
  background: rgba(220, 38, 38, 0.1);
  border: 1px solid rgba(220, 38, 38, 0.3);
  border-radius: 12px;
  color: var(--red);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-logout:hover {
  background: rgba(220, 38, 38, 0.2);
}

/* ========== MAIN GAME AREA ========== */
.game-main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 1100px) {
  .game-main {
    grid-template-columns: 1fr;
  }
}

/* ========== GAME TABLE ========== */
.table-container {
  border-radius: 32px;
  padding: 32px;
}

.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.table-title {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
}

.difficulty-select {
  display: flex;
  gap: 8px;
}

.diff-btn {
  padding: 10px 18px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.diff-btn.active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg-dark);
}

.diff-btn:hover:not(.active) {
  background: rgba(255, 255, 255, 0.08);
}

/* ========== FELT TABLE ========== */
.felt-table {
  position: relative;
  width: 100%;
  height: 380px;
  border-radius: 180px / 60px;
  background: radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-dark) 100%);
  margin: 32px 0;
  box-shadow: 
    inset 0 0 60px rgba(0, 0, 0, 0.5),
    0 20px 60px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}

.felt-table::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  pointer-events: none;
}

.felt-table::after {
  content: '';
  position: absolute;
  inset: 20px;
  border: 2px solid rgba(212, 175, 55, 0.15);
  border-radius: 160px / 50px;
  pointer-events: none;
}

/* ========== CUPS ========== */
.cup {
  position: absolute;
  width: 70px;
  height: 100px;
  bottom: 38%;
  cursor: pointer;
  transform-origin: bottom center;
  transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease;
  filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.5));
}

.cup-body {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, 
    #c9a227 0%, 
    #f4d03f 20%, 
    #c9a227 40%, 
    #8b6914 60%, 
    #f4d03f 80%, 
    #c9a227 100%);
  border-radius: 50% 50% 5px 5px / 30% 30% 5px 5px;
  position: relative;
  box-shadow: 
    inset -8px 0 20px rgba(0, 0, 0, 0.3),
    inset 8px 0 20px rgba(255, 255, 255, 0.2);
}

.cup-body::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 10px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  border-radius: 50%;
}

.cup-body::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 15px;
  background: linear-gradient(180deg, #8b6914, #5c4a0f);
  border-radius: 0 0 5px 5px;
}

.cup.lifted {
  transform: translateY(-120px) rotateX(15deg);
}

.cup.glow .cup-body {
  box-shadow: 
    0 0 30px var(--gold),
    0 0 60px var(--gold),
    inset -8px 0 20px rgba(0, 0, 0, 0.3),
    inset 8px 0 20px rgba(255, 255, 255, 0.2);
}

.cup:hover:not(.lifted) {
  transform: translateY(-8px);
}

/* ========== BALL ========== */
.ball {
  position: absolute;
  width: 24px;
  height: 24px;
  bottom: 35%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, #ff1744 40%, #b71c1c);
  box-shadow: 
    0 5px 15px rgba(0, 0, 0, 0.5),
    inset 0 -3px 8px rgba(0, 0, 0, 0.3),
    inset 0 3px 8px rgba(255, 255, 255, 0.3);
  transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
  z-index: 5;
}

/* ========== MESSAGE ========== */
.game-message {
  text-align: center;
  font-size: 1.5rem;
  font-weight: 600;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.game-message.win {
  color: var(--gold);
  text-shadow: 0 0 30px var(--gold);
}

.game-message.lose {
  color: var(--red);
}

/* ========== BETTING PANEL ========== */
.betting-section {
  margin-top: 32px;
}

.bet-display {
  text-align: center;
  margin-bottom: 24px;
}

.bet-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.bet-amount {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.bet-chips {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.chip {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  color: white;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

.chip::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 3px dashed rgba(255, 255, 255, 0.3);
  border-radius: 50%;
}

.chip:hover {
  transform: translateY(-5px) scale(1.05);
}

.chip:active {
  transform: translateY(-2px) scale(1);
}

.chip-1k { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 6px 0 #1e40af, 0 10px 20px rgba(59, 130, 246, 0.4); }
.chip-5k { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 6px 0 #166534, 0 10px 20px rgba(34, 197, 94, 0.4); }
.chip-10k { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 6px 0 #7f1d1d, 0 10px 20px rgba(220, 38, 38, 0.4); }
.chip-25k { background: linear-gradient(135deg, #7c3aed, #5b21b6); box-shadow: 0 6px 0 #4c1d95, 0 10px 20px rgba(124, 58, 237, 0.4); }
.chip-allin { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); box-shadow: 0 6px 0 #7a5c0f, 0 10px 20px rgba(212, 175, 55, 0.4); color: var(--bg-dark); }

.action-buttons {
  display: flex;
  gap: 16px;
}

.btn-start {
  flex: 1;
  padding: 20px;
  font-size: 1.2rem;
}

/* ========== SIDEBAR ========== */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.sidebar-card {
  border-radius: 24px;
  padding: 24px;
}

.sidebar-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ========== MULTIPLIERS INFO ========== */
.multiplier-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.multiplier-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
}

.multiplier-level {
  font-weight: 500;
}

.multiplier-value {
  font-weight: 700;
  color: var(--gold);
}

/* ========== STATS CARD ========== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.stats-item {
  text-align: center;
  padding: 16px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 16px;
}

.stats-number {
  font-size: 1.8rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stats-number.green { color: var(--green); }
.stats-number.red { color: var(--red); }
.stats-number.gold { color: var(--gold); }

.stats-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== HISTORY ========== */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  font-size: 0.9rem;
}

.history-result {
  font-weight: 600;
}

.history-result.win { color: var(--green); }
.history-result.lose { color: var(--red); }

/* ========== DONATE ========== */
.donate-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #6200ea, #aa00ff);
  border: none;
  border-radius: 16px;
  color: white;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.donate-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(98, 0, 234, 0.4);
}

/* ========== CONFETTI ========== */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 1000;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    gap: 16px;
  }
  
  .nav-stats {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .difficulty-select {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .felt-table {
    height: 320px;
    border-radius: 100px / 40px;
  }
  
  .cup {
    width: 55px;
    height: 80px;
  }
  
  .ball {
    width: 18px;
    height: 18px;
  }
  
  .bet-chips {
    gap: 8px;
  }
  
  .chip {
    width: 54px;
    height: 54px;
    font-size: 0.75rem;
  }
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--text-muted);
  border-radius: 3px;
}
</style>
</head>
