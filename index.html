<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Cups PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:'Segoe UI',sans-serif;
 background:radial-gradient(circle at top,#021018,#000);
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow-x:hidden;
}

.panel{
 width:520px;
 max-width:94vw;
 background:linear-gradient(160deg,#0b2a3d,#04141c);
 border-radius:26px;
 padding:22px;
 box-shadow:0 60px 180px rgba(0,0,0,.95);
}

.hidden{display:none}

button{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(90deg,#00e676,#00c853);
 margin-top:10px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 margin-bottom:12px;
}

.table{
 position:relative;
 height:240px;
 margin:25px 0;
 border-radius:20px;
 background:radial-gradient(circle,#063a52,#010b12);
 overflow:hidden;
}

.cup{
 width:85px;
 height:110px;
 position:absolute;
 bottom:55px;
 border-radius:80px 80px 0 0;
 background:linear-gradient(#ffc46b,#ff6d00);
 transition:.3s;
}

.lift{transform:translateY(-70px)}
.glow{box-shadow:0 0 25px gold}

.ball{
 width:26px;
 height:26px;
 border-radius:50%;
 background:radial-gradient(circle,#fff,#ff1744);
 position:absolute;
 bottom:35px;
}
</style>
</head>

<body>

<div id="auth" class="panel">
<h2>🔥 Shadow Cups PRO</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Parolă">

<button onclick="register()">Înregistrare</button>
<button onclick="login()">Login</button>
</div>

<div id="game" class="panel hidden">

<div class="topbar">
<div>💰 Coins: <span id="coins">0</span></div>
<select id="level">
<option value="easy">Easy x3</option>
<option value="medium">Medium x5</option>
<option value="hard">Hard x10</option>
</select>
</div>

<div class="table" id="table">
<div id="ball" class="ball"></div>
</div>

<button onclick="startRound()">START</button>
<div id="msg" style="margin-top:10px;font-weight:bold"></div>

</div>

<script>

const SUPABASE_URL="https://pakagqkhpwzcqrluyarw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBha2FncWtocHd6Y3FybHV5YXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5OTg2NTgsImV4cCI6MjA4NjU3NDY1OH0.l24o0QSKN7Dnn9O3ptimbCNqAs6yzO3KnDIb2JxsYwAa";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let cups=[],slots=[],playing=false,coins=0;

async function register(){
 const email=document.getElementById('email').value;
 const pass=document.getElementById('pass').value;
 await sb.auth.signUp({email,password:pass});
 alert("Verifică email.");
}

async function login(){
 const email=document.getElementById('email').value;
 const pass=document.getElementById('pass').value;
 await sb.auth.signInWithPassword({email,password:pass});
 initGame();
}

async function initGame(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user)return;

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 let {data}=await sb.from("players")
 .select("*").eq("id",user.id).maybeSingle();

 if(!data){
  await sb.from("players").insert({id:user.id,email:user.email});
  return initGame();
 }

 coins=data.coins;
 document.getElementById("coins").innerText=coins;
 createCups();
}

function createCups(){
 const table=document.getElementById("table");
 table.querySelectorAll(".cup").forEach(c=>c.remove());
 cups=[];slots=[];
 const spacing=table.offsetWidth/4;

 for(let i=0;i<3;i++){
  const pos=spacing*(i+1)-42;
  slots.push(pos);
  const cup=document.createElement("div");
  cup.className="cup";
  cup.style.left=pos+"px";
  table.appendChild(cup);
  cups.push(cup);
 }
}

function startRound(){
 if(playing)return;
 playing=true;
 document.getElementById("msg").innerText="Alege un pahar!";
 cups.forEach(c=>c.onclick=()=>pick(c));
}

async function pick(cup){
 if(!playing)return;
 playing=false;

 const pickedIndex=cups.indexOf(cup);
 const {data:{session}}=await sb.auth.getSession();

 const res=await fetch(
  "https://pakagqkhpwzcqrluyarw.supabase.co/functions/v1/play-round",
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+session.access_token
   },
   body:JSON.stringify({
    bet:5000,
    level:document.getElementById("level").value,
    picked:pickedIndex
   })
  }
 );

 const data=await res.json();
 coins=data.coins;
 document.getElementById("coins").innerText=coins;

 if(data.result){
  cups[data.winningCup].classList.add("glow");
  document.getElementById("msg").innerText="🔥 AI CÂȘTIGAT";
 }else{
  cups[data.winningCup].classList.add("lift");
  document.getElementById("msg").innerText="❌ Ai pierdut";
 }
}

</script>
</body>
</html>
