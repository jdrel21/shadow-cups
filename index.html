body{
 margin:0;

 color:white;
 min-height:100vh;

 justify-content:center;
 align-items:center;

.panel{
 width:520px;
 max-width:94vw;
 background:linear-gradient(160deg,#0b2a3d,#04141c);
 border-radius:26px;
 padding:22px;
 box-shadow:0 60px 180px rgba(0,0,0,.95);
}

.hidden{display:none}

input,select{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 margin:10px 0;
}

button{
 width:100%;
 padding:16px;
 border:none;
 border-radius:16px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(90deg,#00e676,#00c853);
 transition:.2s;
}

button:active{transform:scale(.96)}
.secondary{background:#ff5252}
.auth-buttons button{margin-top:14px}

.topbar{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 margin-bottom:12px;
}

.table{
 position:relative;
 height:240px;
 margin:25px 0;
 border-radius:20px;
 background:radial-gradient(circle,#063a52,#010b12);
 overflow:hidden;
}

.cup{
 width:85px;
 height:110px;
 position:absolute;
 bottom:55px;
 border-radius:80px 80px 0 0;
 background:linear-gradient(#ffc46b,#ff6d00);
 box-shadow:0 12px 30px rgba(0,0,0,.7);
 transition:left .35s ease, transform .25s ease;
}

.glow{
 box-shadow:0 0 25px gold,0 0 50px orange;
}

.lift{transform:translateY(-70px)}

.ball{
 width:26px;
 height:26px;
 border-radius:50%;
 background:radial-gradient(circle,#fff,#ff1744);
 position:absolute;
 bottom:35px;
 transition:left .35s ease, opacity .2s;
}

.bet-row{display:flex;gap:14px;margin-top:14px}
.bet-row button{flex:1}

.stats{display:flex;justify-content:space-between;margin-top:10px}
.msg{text-align:center;font-weight:bold;margin-top:12px}

</style></head><body><!-- AUTH --><div id="auth" class="panel">
<h1>🎰 Casino Production</h1>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Parolă (min 6)">
<div class="auth-buttons">
<button onclick="register()">Înregistrare</button>
<button onclick="login()">Login</button>
</div>
</div><!-- GAME --><div id="game" class="panel hidden"><div class="topbar">
<div>💰 Coins: <span id="coins">0</span></div>
<select id="level">
<option value="easy">Easy x3</option>
<option value="medium">Medium x5</option>
<option value="hard">Hard x10</option>
</select>
</div><h2>Găsește bila</h2><div class="table" id="table">
<div id="ball" class="ball"></div>
</div><div class="bet-row">
<button onclick="setBet(1000)">1000</button>
<button onclick="setBet(5000)">5000</button>
<button onclick="setBet(10000)">10000</button>
<button onclick="allIn()">ALL IN</button>
</div><button style="margin-top:16px" onclick="startRound()">START</button> <button class="secondary" style="margin-top:10px" onclick="logout()">Logout</button><div class="stats">
<div>Victorii: <span id="wins">0</span></div>
<div>Înfrângeri: <span id="loss">0</span></div>
</div><div class="msg" id="msg"></div></div><audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio> <audio id="shuffleSound" src="https://assets.mixkit.co/sfx/preview/mixkit-card-shuffle-2036.mp3"></audio>

<script>

//////////////// SUPABASE //////////////////
const SUPABASE_URL = "https://pakagqkhpwzcqrluyarw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBha2FncWtocHd6Y3FybHV5YXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5OTg2NTgsImV4cCI6MjA4NjU3NDY1OH0.l24o0QSKN7Dnn9O3ptimbCNqAs6yzO3KnDIb2JxsYwA";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

//////////////// GLOBAL STATE //////////////////
let userData=null;
let coins=0,wins=0,loss=0;
let cups=[],slots=[],ballCup=null,playing=false,bet=5000;

//////////////// AUTH //////////////////
async function register(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value.trim();

 if(pass.length<6) return alert('Parola minim 6 caractere');

 const {error} = await sb.auth.signUp({email,password:pass});
 if(error) return alert(error.message);

 alert('Verifică emailul pentru confirmare!');
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('pass').value.trim();

 const {error} = await sb.auth.signInWithPassword({email,password:pass});
 if(error) return alert(error.message);

 // AUTO SESSION RESTORE
async function restoreSession(){
 const {data:{session}} = await sb.auth.getSession();
 if(session?.user){
   initGame();
 }
}

restoreSession();

sb.auth.onAuthStateChange((event, session) => {
 if(session?.user){
   initGame();
 }
});
}

async function logout(){
 await sb.auth.signOut();
 location.reload();
}

//////////////// SESSION //////////////////
async function initGame(){
 const {data:{user}} = await sb.auth.getUser();
 if(!user) return;

 document.getElementById('auth').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');

 let {data, error} = await sb
 .from('players')
 .select('*')
 .eq('id',user.id)
 .maybeSingle();

 if(!data){
   const {error:insertError} = await sb.from('players').insert({
     id:user.id,
     email:user.email,
     coins:100000,
     wins:0,
     loss:0
   });

   if(insertError){
     console.error(insertError);
     alert('Eroare creare profil');
     return;
   }

   data={coins:100000,wins:0,loss:0};
 }

 userData=user;
 coins=data.coins;
 wins=data.wins;
 loss=data.loss;

 updateHUD();
 setTimeout(createCups,80);
}

initGame();

//////////////// SAVE //////////////////
async function save(){
 if(!userData) return;

 await sb
 .from('players')
 .update({coins,wins,loss})
 .eq('id',userData.id);
}

//////////////// HUD //////////////////
function updateHUD(){
 document.getElementById('coins').innerText=coins;
 document.getElementById('wins').innerText=wins;
 document.getElementById('loss').innerText=loss;
}

function msg(t){document.getElementById('msg').innerText=t}

//////////////// BET //////////////////
function setBet(v){bet=v;msg('Pariu: '+v);} 
function allIn(){bet=coins;msg('ALL IN 🔥');}

//////////////// CREATE CUPS //////////////////
function createCups(){
 const table=document.getElementById('table');
 table.querySelectorAll('.cup').forEach(c=>c.remove());
 cups=[];
 slots=[];

 const spacing=table.offsetWidth/4;

 for(let i=0;i<3;i++){
  const pos=spacing*(i+1)-42;
  slots.push(pos);

  const cup=document.createElement('div');
  cup.className='cup';
  cup.style.left=pos+'px';

  table.appendChild(cup);
  cups.push(cup);
 }
}

//////////////// BALL //////////////////
function attachBall(cup){
 ballCup=cup;
 moveBall();
 document.getElementById('ball').style.opacity=1;
}

function moveBall(){
 const index=cups.indexOf(ballCup);
 document.getElementById('ball').style.left=(slots[index]+30)+'px';
}

function hideBall(){document.getElementById('ball').style.opacity=0}

function resetCups(){cups.forEach(c=>c.classList.remove('lift','glow'));}

//////////////// SHUFFLE //////////////////
function shuffleArray(){
 for(let i=cups.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [cups[i],cups[j]]=[cups[j],cups[i]];
 }

 cups.forEach((cup,index)=>{
  cup.style.left=slots[index]+'px';
 });

 moveBall();
}

//////////////// ROUND //////////////////
function startRound(){
 if(playing) return;
 if(coins<bet) return msg('Nu ai coins');

 resetCups();
 attachBall(cups[Math.floor(Math.random()*3)]);

 msg('Urmărește bila...');

 const lvl=document.getElementById('level').value;
 let speed=260, times=10;

 if(lvl==='easy'){speed=420;times=6}
 if(lvl==='medium'){speed=260;times=10}
 if(lvl==='hard'){speed=200;times=14}

 setTimeout(()=>{
  hideBall();
  document.getElementById('shuffleSound').play();

  let i=0;
  const loop=setInterval(()=>{
   shuffleArray();
   i++;

   if(i>=times){
    clearInterval(loop);
    playing=true;
    msg('Alege un pahar!');

    cups.forEach(cup=>cup.onclick=()=>pick(cup));
   }

  },speed);
 },900);
}

//////////////// PICK //////////////////
async function pick(cup){
 if(!playing) return;
 playing=false;
 resetCups();

 cup.classList.add('lift');
 document.getElementById('ball').style.opacity=1;

 const pickedIndex = cups.indexOf(cup);

 const { data:{session} } = await sb.auth.getSession();

 const res = await fetch(
 "https://pakagqkhpwzcqrluyarw.supabase.co/functions/v1/play-round",
 {
   method:"POST",
   headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+session.access_token
   },
   body:JSON.stringify({
     bet,
     level:document.getElementById('level').value,
     picked:pickedIndex
   })
 });
 if(!res.ok){
 alert("Eroare server: " + res.status);
 return;
 }

 const data = await res.json();

 alert(JSON.stringify(data));

 coins = data.coins;

 if(data.result){
   wins++;
   cups[data.winningCup].classList.add('glow');
   msg('🔥 AI CÂȘTIGAT');
 }else{
   loss++;
   cups[data.winningCup].classList.add('lift');
   msg('❌ Ai pierdut');
 }

 updateHUD();
 }

</script></body></html>
