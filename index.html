<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Production NEXT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
 margin:0;
 font-family:'Segoe UI',sans-serif;
 background:radial-gradient(circle at top,#021018,#000);
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow-x:hidden;
}

.panel{
 width:520px;
 max-width:94vw;
 background:linear-gradient(160deg,#0b2a3d,#04141c);
 border-radius:26px;
 padding:22px;
 box-shadow:0 60px 180px rgba(0,0,0,.95);
}

.hidden{display:none}

input,select{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 margin:10px 0;
}

button{
 width:100%;
 padding:16px;
 border:none;
 border-radius:16px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(90deg,#00e676,#00c853);
 transition:.2s;
}

button:active{transform:scale(.96)}
.secondary{background:#ff5252}

.topbar{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 margin-bottom:12px;
}

.table{
 position:relative;
 height:240px;
 margin:25px 0;
 border-radius:20px;
 background:radial-gradient(circle,#063a52,#010b12);
 overflow:hidden;
}

.cup{
 width:85px;
 height:110px;
 position:absolute;
 bottom:55px;
 border-radius:80px 80px 0 0;
 background:linear-gradient(#ffc46b,#ff6d00);
 box-shadow:0 12px 30px rgba(0,0,0,.7);
 transition:left .35s ease, transform .25s ease;
}

.glow{box-shadow:0 0 25px gold,0 0 50px orange}
.lift{transform:translateY(-70px)}

.vip{
 animation:vipPulse 1s infinite alternate;
}

@keyframes vipPulse{
 from{box-shadow:0 0 15px gold}
 to{box-shadow:0 0 40px orange}
}

.ball{
 width:26px;
 height:26px;
 border-radius:50%;
 background:radial-gradient(circle,#fff,#ff1744);
 position:absolute;
 bottom:35px;
 transition:left .35s ease, opacity .2s;
}

.bet-row{display:flex;gap:14px;margin-top:14px}
.bet-row button{flex:1}

.stats{display:flex;justify-content:space-between;margin-top:10px}
.msg{text-align:center;font-weight:bold;margin-top:12px}

.leaderboard{
 margin-top:15px;
 font-size:13px;
 opacity:.9;
}

</style>
</head>
<body>

<div id="auth" class="panel">
<h1>🎰 Casino Production</h1>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Parolă">
<button onclick="register()">Înregistrare</button>
<button onclick="login()">Login</button>
</div>

<div id="game" class="panel hidden">

<div class="topbar">
<div>💰 Coins: <span id="coins">0</span></div>
<select id="level">
<option value="easy">Easy x3</option>
<option value="medium">Medium x5</option>
<option value="hard">Hard x10</option>
</select>
</div>

<h2>Găsește bila</h2>

<div class="table" id="table">
<div id="ball" class="ball"></div>
</div>

<div class="bet-row">
<button onclick="setBet(1000)">1000</button>
<button onclick="setBet(5000)">5000</button>
<button onclick="setBet(10000)">10000</button>
<button onclick="allIn()">ALL IN</button>
</div>

<button style="margin-top:16px" onclick="startRound()">START</button>
<button class="secondary" style="margin-top:10px" onclick="logout()">Logout</button>

<div class="stats">
<div>Victorii: <span id="wins">0</span></div>
<div>Înfrângeri: <span id="loss">0</span></div>
</div>

<div class="msg" id="msg"></div>

<div class="leaderboard">
<h3>🏆 Top 5</h3>
<div id="leaderboard"></div>
</div>

<div style="font-size:12px;opacity:.6;margin-top:10px">
Sistem anti-cheat activ. Manipularea codului duce la blocarea contului.
</div>

</div>

<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
<audio id="shuffleSound" src="https://assets.mixkit.co/sfx/preview/mixkit-card-shuffle-2036.mp3"></audio>
<audio id="bgSound" src="https://assets.mixkit.co/sfx/preview/mixkit-casino-ambience-ambient-1132.mp3" loop></audio>

<script>

const SUPABASE_URL="https://pakagqkhpwzcqrluyarw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBha2FncWtocHd6Y3FybHV5YXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5OTg2NTgsImV4cCI6MjA4NjU3NDY1OH0.l24o0QSKN7Dnn9O3ptimbCNqAs6yzO3KnDIb2JxsYwA";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let userData=null;
let coins=0,wins=0,loss=0;
let cups=[],slots=[],ballCup=null,playing=false,bet=5000;
let lastRound=0;

async function register(){
 const email=emailInput();
 const pass=passInput();
 await sb.auth.signUp({email,password:pass});
 alert("Verifică emailul.");
}

async function login(){
 const email=emailInput();
 const pass=passInput();
 await sb.auth.signInWithPassword({email,password:pass});
 initGame();
}

function emailInput(){return document.getElementById('email').value}
function passInput(){return document.getElementById('pass').value}

async function initGame(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user)return;

 userData=user;
 document.getElementById('auth').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');

 let {data}=await sb.from('players')
 .select('*').eq('id',user.id).maybeSingle();

 if(!data){
   await sb.from('players').insert({
     id:user.id,email:user.email,
     coins:100000,wins:0,loss:0
   });
   return initGame();
 }

 coins=data.coins;
 wins=data.wins;
 loss=data.loss;

 updateHUD();
 createCups();
 dailyBonus();
 loadLeaderboard();

 document.getElementById("bgSound").volume=.2;
 document.getElementById("bgSound").play();
}

function updateHUD(){
 document.getElementById('coins').innerText=coins;
 document.getElementById('wins').innerText=wins;
 document.getElementById('loss').innerText=loss;
}

function msg(t){document.getElementById('msg').innerText=t}

function setBet(v){bet=v;msg("Pariu "+v)}
function allIn(){bet=coins;msg("ALL IN")}

function createCups(){
 const table=document.getElementById('table');
 table.querySelectorAll('.cup').forEach(c=>c.remove());
 cups=[];slots=[];
 const spacing=table.offsetWidth/4;

 for(let i=0;i<3;i++){
  const pos=spacing*(i+1)-42;
  slots.push(pos);
  const cup=document.createElement('div');
  cup.className='cup';
  cup.style.left=pos+'px';
  table.appendChild(cup);
  cups.push(cup);
 }
}

function startRound(){
 if(playing)return;
 if(Date.now()-lastRound<2000)return msg("Așteaptă...");
 lastRound=Date.now();
 if(coins<bet)return msg("Nu ai coins");

 resetCups();
 attachBall(cups[Math.floor(Math.random()*3)]);
 coins-=bet;
 updateHUD();
 msg("Urmărește bila...");

 setTimeout(()=>{
  hideBall();
  document.getElementById('shuffleSound').play();
  let i=0;
  const loop=setInterval(()=>{
   shuffleArray();
   i++;
   if(i>=10){
    clearInterval(loop);
    playing=true;
    msg("Alege un pahar!");
    cups.forEach(c=>c.onclick=()=>pick(c));
   }
  },250);
 },800);
}

function attachBall(cup){
 ballCup=cup;
 moveBall();
 document.getElementById('ball').style.opacity=1;
}

function moveBall(){
 const index=cups.indexOf(ballCup);
 document.getElementById('ball').style.left=(slots[index]+30)+'px';
}

function hideBall(){document.getElementById('ball').style.opacity=0}
function resetCups(){cups.forEach(c=>c.classList.remove('lift','glow','vip'))}

function shuffleArray(){
 for(let i=cups.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [cups[i],cups[j]]=[cups[j],cups[i]];
 }
 cups.forEach((cup,index)=>cup.style.left=slots[index]+'px');
 moveBall();
}

async function pick(cup){
 if(!playing)return;
 playing=false;

 cup.classList.add('lift');
 document.getElementById('ball').style.opacity=1;

 let multi=document.getElementById('level').value==="hard"?10:
 document.getElementById('level').value==="medium"?5:3;

 if(cup===ballCup){
  const win=bet*multi;
  coins+=win;
  wins++;
  cup.classList.add('glow','vip');
  document.getElementById('winSound').play();
  msg("🔥 AI CÂȘTIGAT "+win);
 }else{
  loss++;
  ballCup.classList.add('lift');
  msg("❌ Ai pierdut");
 }

 updateHUD();
 await sb.from('players')
 .update({coins,wins,loss})
 .eq('id',userData.id);

 loadLeaderboard();
}

async function loadLeaderboard(){
 const {data}=await sb.from('players')
 .select('email,wins')
 .order('wins',{ascending:false})
 .limit(5);

 let html="";
 data.forEach(p=>html+=`<div>${p.email} - ${p.wins} wins</div>`);
 document.getElementById('leaderboard').innerHTML=html;
}

function dailyBonus(){
 const today=new Date().toDateString();
 if(localStorage.getItem("bonus")!==today){
  coins+=1000;
  localStorage.setItem("bonus",today);
  msg("🎁 Daily Bonus +1000");
  updateHUD();
 }
}

</script>
</body>
</html>
